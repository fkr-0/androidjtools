name: Android E2E Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-conformance:
    name: Complete Android instrumentation / API 35 (not full parity)
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install protocol test dependencies
        run: python -m pip install --disable-pip-version-check -r test-server/requirements-test.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make runners executable
        run: chmod +x ./gradlew e2e/parity/run_conformance.py e2e/ui/run_ui_e2e.py

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Execute complete connectedDebugAndroidTest suite and emulator conformance tier
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euo pipefail
            mkdir -p artifacts/e2e
            adb shell cmd uimode night no || true
            adb shell settings put system font_scale 1.0
            python3 e2e/parity/run_conformance.py \
              --profile emulator \
              --report artifacts/e2e/conformance.json

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidjtools-api35-e2e-conformance
          path: |
            artifacts/e2e/**
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 30
