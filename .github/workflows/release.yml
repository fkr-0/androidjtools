name: Publish GitHub Release

on:
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: github-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish-release:
    name: Publish tag artifact after hosted gates
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read

    steps:
      - name: Check out the exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve version-matched release tag
        id: release
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"

          version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$version"
          tag="v${version}"

          if ! git tag --points-at "$TESTED_SHA" --list "$tag" | grep -Fxq "$tag"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No version-matched v* tag points at the tested revision; this is a normal branch/PR CI completion."
            exit 0
          fi

          test "$(git rev-list -n1 "$tag")" = "$TESTED_SHA"
          grep -Fq "## ${version} -" CHANGELOG.md
          {
            echo "publish=true"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Require successful API-35 E2E conformance for the same revision
        if: steps.release.outputs.publish == 'true'
        id: e2e
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh run list \
            --workflow "Android E2E Conformance" \
            --commit "$TESTED_SHA" \
            --status success \
            --limit 20 \
            --json databaseId,conclusion,event,headSha \
            > /tmp/e2e-runs.json

          run_id="$(python3 - <<'PY'
          import json
          from pathlib import Path

          runs = json.loads(Path('/tmp/e2e-runs.json').read_text())
          matches = [
              run for run in runs
              if run.get('conclusion') == 'success'
              and run.get('event') == 'push'
          ]
          print(matches[0]['databaseId'] if matches else '')
          PY
          )"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the APK produced by the successful tag CI run
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts/download
          gh run download "$CI_RUN_ID" \
            --name "androidjtools-v${VERSION}-debug-apk" \
            --dir release-artifacts/download

          apk="$(find release-artifacts/download -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          test -s "$apk"
          install -m 0644 "$apk" "release-artifacts/androidjtools-v${VERSION}-debug.apk"
          (cd release-artifacts && sha256sum "androidjtools-v${VERSION}-debug.apk" > SHA256SUMS)

      - name: Write release provenance
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          ANDROID_CI_RUN_ID: ${{ github.event.workflow_run.id }}
          E2E_RUN_ID: ${{ steps.e2e.outputs.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          apk = Path('release-artifacts') / f"androidjtools-v{os.environ['VERSION']}-debug.apk"
          payload = {
              'schema': 'androidjtools.github-release-provenance/v1',
              'tag': os.environ['TAG'],
              'git_revision': os.environ['TESTED_SHA'],
              'android_ci_run_id': int(os.environ['ANDROID_CI_RUN_ID']),
              'api35_e2e_run_id': int(os.environ['E2E_RUN_ID']),
              'artifact': {
                  'name': apk.name,
                  'size_bytes': apk.stat().st_size,
                  'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
              },
          }
          Path('release-artifacts/release-provenance.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Publish immutable GitHub Release
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

          gh release create "$TAG" \
            "release-artifacts/androidjtools-v${VERSION}-debug.apk" \
            "release-artifacts/SHA256SUMS" \
            "release-artifacts/release-provenance.json" \
            --verify-tag \
            --title "Android DJ Tools ${TAG}" \
            --generate-notes
