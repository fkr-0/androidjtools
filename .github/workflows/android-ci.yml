name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify release metadata consistency
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n1)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$version"
          test -n "$version_code"
          grep -Fq "## ${version} -" CHANGELOG.md
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "v${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install protocol test dependencies
        run: python -m pip install --disable-pip-version-check -r test-server/requirements-test.txt

      - name: Verify sync protocol contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          python -m unittest discover -s test-server -p 'test_*.py' -v
          PYTHONPATH=test-server/samplelib python -m unittest discover -s test-server/samplelib -p 'test_*.py' -v

      - name: Test release signature verifier
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Restore release keystore (version tags only)
        if: github.ref_type == 'tag'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          keystore="$RUNNER_TEMP/release.keystore"
          (umask 077 && printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore")
          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Test, lint, compile instrumentation tests, and build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ github.ref_type == 'tag' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.ref_type == 'tag' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.ANDROID_KEY_PASSWORD || '' }}
          REQUIRE_RELEASE_SIGNING: ${{ github.ref_type == 'tag' && 'true' || 'false' }}
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug :app:assembleDebug :app:assembleRelease -PrequireReleaseSigning="$REQUIRE_RELEASE_SIGNING" --stacktrace

      - name: Verify production launcher and record APK checksums
        shell: bash
        env:
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          release_apk=app/build/outputs/apk/release/app-release.apk
          debug_apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$release_apk"
          test -s "$debug_apk"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apkanalyzer_bin="$(command -v apkanalyzer || true)"
          apksigner_bin="$(command -v apksigner || true)"
          if [[ -z "$apkanalyzer_bin" && -n "$sdk_root" ]]; then
            apkanalyzer_bin="$(find "$sdk_root/cmdline-tools" -type f -name apkanalyzer -print 2>/dev/null | sort -V | tail -n1)"
          fi
          if [[ -z "$apksigner_bin" && -n "$sdk_root" ]]; then
            apksigner_bin="$(find "$sdk_root/build-tools" -type f -name apksigner -print 2>/dev/null | sort -V | tail -n1)"
          fi
          test -x "$apkanalyzer_bin"
          test -x "$apksigner_bin"

          "$apkanalyzer_bin" manifest print "$release_apk" > /tmp/release-manifest.xml
          "$apkanalyzer_bin" manifest print "$debug_apk" > /tmp/debug-manifest.xml
          python3 scripts/check_manifest_hardening.py /tmp/release-manifest.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          ANDROID = "{http://schemas.android.com/apk/res/android}"
          EXPECTED = "dev.androidjtools.shell.AndroidDjToolsActivity"
          DEBUG_HARNESS = "dev.androidjtools.debug.DebugHarnessActivity"

          def launchers(path):
              root = ET.parse(path).getroot()
              result = []
              for activity in root.findall("./application/activity"):
                  name = activity.get(ANDROID + "name")
                  for intent_filter in activity.findall("intent-filter"):
                      actions = {item.get(ANDROID + "name") for item in intent_filter.findall("action")}
                      categories = {item.get(ANDROID + "name") for item in intent_filter.findall("category")}
                      if "android.intent.action.MAIN" in actions and "android.intent.category.LAUNCHER" in categories:
                          result.append(name)
              return result, {activity.get(ANDROID + "name") for activity in root.findall("./application/activity")}

          release_launchers, release_activities = launchers("/tmp/release-manifest.xml")
          debug_launchers, _ = launchers("/tmp/debug-manifest.xml")
          if release_launchers != [EXPECTED]:
              raise SystemExit(f"unexpected release launcher(s): {release_launchers}")
          if DEBUG_HARNESS in release_activities:
              raise SystemExit("debug harness leaked into release APK")
          if debug_launchers != [EXPECTED]:
              raise SystemExit(f"debug APK must also launch the real app, got: {debug_launchers}")
          PY

          test "$("$apkanalyzer_bin" manifest debuggable "$release_apk")" = "false"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            # Official build: must match the pinned release certificate, never the debug key.
            python3 scripts/verify_release_signature.py "$release_apk"
          else
            # Branch/PR build: debug-signed and unofficial; verify the signature is intact only.
            python3 scripts/verify_release_signature.py "$release_apk" --allow-debug
          fi
          sha256sum "$release_apk" "$debug_apk"

      - name: Upload primary release APK
        uses: actions/upload-artifact@v4
        with:
          name: androidjtools-v${{ steps.app_version.outputs.version }}-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload secondary debug APK
        uses: actions/upload-artifact@v4
        with:
          name: androidjtools-v${{ steps.app_version.outputs.version }}-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  render-ui-screenshots:
    name: Render Android UI screenshots
    needs: verify-and-build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Render screenshots on Android 15 / Pixel 7 Pro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash e2e/ui/run_ci_screenshots.sh

      - name: Upload rendered Android UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: androidjtools-android15-ui-screenshots
          path: artifacts/ui-screenshots/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload instrumentation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: androidjtools-ui-screenshot-diagnostics
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14
